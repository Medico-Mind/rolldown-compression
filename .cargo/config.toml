[env]
CFLAGS_x86_64_unknown_linux_gnu  = "-march=x86-64-v2"
CFLAGS_x86_64_unknown_linux_musl = "-march=x86-64-v2"
CFLAGS_x86_64_apple_darwin       = "-march=x86-64-v2"
CFLAGS_aarch64_apple_darwin      = "-mcpu=apple-m1"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static", "-C", "target-cpu=x86-64-v2"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]