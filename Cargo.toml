[package]
name = "rolldown-compression"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
brotli = "8"
crossbeam-deque = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
hotpath = "0.23"
napi = { version = "3", default-features = false, features = ["napi10", "dyn-symbols", "node_version_detect"] }
napi-derive = "3"
rayon = "1.12"
zstd = "0.13"

[features]
# Opt-in profiling. Off by default: every hotpath macro expands to a noop and
# the crate pulls in no third-party dependencies, so a normal build is
# unaffected at compile time and at runtime.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = "0.1"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
