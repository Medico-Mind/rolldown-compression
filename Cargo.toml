[package]
name = "rolldown-compression"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mbrotli = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
hotpath = "0.25"
napi = { version = "3", default-features = false, features = ["napi10", "dyn-symbols", "node_version_detect"] }
napi-derive = "3"
rayon = "1.12"
thiserror = "2"
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
# Decoder only: `mbrotli` compresses but ships no decoder, so the round-trip
# tests still need one.
simd-brotli = { version = "10" }

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath/hotpath-cpu"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc3 = "0.1"

[target.'cfg(target_family = "wasm")'.dependencies]
zstd = { version = "0.14", default-features = false, features = ["no_asm"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc3 = { version = "0.1", features = ["local_dynamic_tls"] }

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
